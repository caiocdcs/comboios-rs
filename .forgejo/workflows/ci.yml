# fmt, clippy, tests and the UI check/build via `just check` from the flake's
# dev shell, on the CI host's nix store (runner label `nix`), so builds are
# reused between runs. The job clones with git.
# Images are built on GitHub only; deploys build from Nix.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: nix
    env:
      NIX_CONFIG: experimental-features = nix-command flakes
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -Dwarnings
    steps:
      - name: checkout
        env:
          TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: token $TOKEN" \
            fetch -q --depth 1 "${{ github.server_url }}/${{ github.repository }}.git" "$SHA"
          git checkout -q FETCH_HEAD
      - name: check
        run: nix develop -c just check
      - name: audit
        run: nix develop -c just audit
