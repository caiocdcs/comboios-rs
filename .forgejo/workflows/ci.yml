# fmt, clippy, tests and the UI check/build via `just check` from the flake's
# dev shell, in one job so everything shares the container's nix store.
# nixos/nix has no node for actions/checkout, so the job clones with git.
# Images are built on GitHub only; deploys build from Nix.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: alpine
    container:
      image: nixos/nix:2.35.4@sha256:f159a58f390677f41e8e900a74b6e2f9c7f27b364122ae6acf7a652ce6c551c0
    env:
      NIX_CONFIG: experimental-features = nix-command flakes
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -Dwarnings
    steps:
      - name: checkout
        env:
          TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: token $TOKEN" \
            fetch -q --depth 1 "${{ github.server_url }}/${{ github.repository }}.git" "$SHA"
          git checkout -q FETCH_HEAD
      - name: check
        run: nix develop -c just check
      - name: audit
        run: nix develop -c just audit
